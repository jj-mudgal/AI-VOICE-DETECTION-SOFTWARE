<svg width="100%" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M2 1L9 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5"/>
</marker>
</defs>

<style>
.box { fill:#0B1220; stroke-width:1.5; rx:12; }
.title { fill:#E5E7EB; font-size:13px; font-weight:600; text-anchor:middle; font-family:system-ui; }
.sub { fill:#9CA3AF; font-size:11px; text-anchor:middle; font-family:system-ui; }
.label { fill:#6B7280; font-size:11px; font-family:system-ui; }
.curve { stroke:#6B7280; stroke-width:2; fill:none; marker-end:url(#arrow); }
</style>

<!-- labels -->
<text x="80" y="120" class="label">USER</text>
<text x="280" y="120" class="label">INTERFACE</text>
<text x="500" y="120" class="label">BACKEND</text>
<text x="740" y="120" class="label">MODEL</text>

<!-- boxes -->
<rect x="60" y="150" width="140" height="70" class="box" stroke="#3B82F6"/>
<text x="130" y="180" class="title">User</text>

<rect x="240" y="140" width="160" height="90" class="box" stroke="#22C55E"/>
<text x="320" y="170" class="title">Gradio UI</text>
<text x="320" y="190" class="sub">Upload · Preview</text>

<rect x="460" y="140" width="180" height="90" class="box" stroke="#A855F7"/>
<text x="550" y="170" class="title">FastAPI</text>
<text x="550" y="190" class="sub">/predict</text>

<rect x="480" y="260" width="140" height="70" class="box" stroke="#06B6D4"/>
<text x="550" y="290" class="title">Inference</text>

<rect x="720" y="200" width="160" height="90" class="box" stroke="#EC4899"/>
<text x="800" y="230" class="title">Model</text>
<text x="800" y="250" class="sub">CNN / Whisper</text>

<!-- curves -->
<path d="M200 185 C220 185, 220 185, 240 185" class="curve"/>
<path d="M400 185 C430 185, 430 185, 460 185" class="curve"/>
<path d="M550 230 C550 240, 550 240, 550 260" class="curve"/>
<path d="M620 295 C660 295, 660 240, 720 245" class="curve"/>

</svg>