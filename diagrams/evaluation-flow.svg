<svg width="100%" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg">

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
    markerWidth="6" markerHeight="6" orient="auto">
    <path d="M2 1L9 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5"/>
  </marker>
</defs>

<style>
.box { fill:#0B1220; stroke-width:1.5; rx:12; }
.title { fill:#E5E7EB; font-size:13px; font-weight:600; font-family:system-ui; }
.sub { fill:#9CA3AF; font-size:11px; font-family:system-ui; }
.curve { stroke:#6B7280; stroke-width:2; fill:none; marker-end:url(#arrow); }
</style>

<!-- DATASET -->
<rect x="100" y="200" width="160" height="80" class="box" stroke="#3B82F6"/>
<text x="180" y="225" text-anchor="middle" dominant-baseline="middle" class="title">
Dataset
</text>
<text x="180" y="250" text-anchor="middle" dominant-baseline="middle" class="sub">
Human + AI
</text>

<!-- AUGMENTATION -->
<rect x="320" y="140" width="180" height="90" class="box" stroke="#22C55E"/>
<text x="410" y="175" text-anchor="middle" dominant-baseline="middle" class="title">
Augmentation
</text>
<text x="410" y="205" text-anchor="middle" dominant-baseline="middle" class="sub">
Noise · Pitch
</text>

<!-- FEATURE -->
<rect x="320" y="280" width="180" height="90" class="box" stroke="#A855F7"/>
<text x="410" y="315" text-anchor="middle" dominant-baseline="middle" class="title">
Feature Extraction
</text>

<!-- TRAIN -->
<rect x="580" y="200" width="180" height="90" class="box" stroke="#06B6D4"/>
<text x="670" y="235" text-anchor="middle" dominant-baseline="middle" class="title">
Model Training
</text>

<!-- BEST -->
<rect x="800" y="200" width="160" height="90" class="box" stroke="#EC4899"/>
<text x="880" y="235" text-anchor="middle" dominant-baseline="middle" class="title">
Best Model
</text>

<!-- CURVES -->
<path d="M260 240 C290 240, 290 180, 320 185" class="curve"/>
<path d="M260 240 C290 240, 290 320, 320 325" class="curve"/>
<path d="M500 185 C540 185, 540 240, 580 240" class="curve"/>
<path d="M500 325 C540 325, 540 240, 580 240" class="curve"/>
<path d="M760 240 C780 240, 780 240, 800 240" class="curve"/>

</svg>