<svg width="100%" viewBox="0 0 1350 820" xmlns="http://www.w3.org/2000/svg">

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
    markerWidth="6" markerHeight="6" orient="auto">
    <path d="M2 1L9 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5"/>
  </marker>
</defs>

<style>
.box { fill:#0B1220; stroke-width:1.6; rx:14; }
.inner { fill:#020817; stroke-width:1.2; rx:10; }
.title { fill:#E5E7EB; font-size:14px; font-weight:600; font-family:system-ui; }
.file { fill:#E5E7EB; font-size:11px; font-family:monospace; }
.desc { fill:#9CA3AF; font-size:10px; font-family:system-ui; }
.line { stroke:#6B7280; stroke-width:2; fill:none; marker-end:url(#arrow); }
</style>

<!-- TOP -->
<rect x="180" y="80" width="240" height="100" class="box" stroke="#3B82F6"/>
<text x="300" y="115" text-anchor="middle" dominant-baseline="middle" class="title">app.py</text>
<text x="300" y="140" text-anchor="middle" dominant-baseline="middle" class="desc">Gradio interface</text>

<rect x="930" y="80" width="240" height="100" class="box" stroke="#06B6D4"/>
<text x="1050" y="115" text-anchor="middle" dominant-baseline="middle" class="title">api.py</text>
<text x="1050" y="140" text-anchor="middle" dominant-baseline="middle" class="desc">FastAPI endpoint</text>

<!-- CORE -->
<rect x="200" y="220" width="950" height="470" class="box" stroke="#22C55E"/>
<text x="675" y="255" text-anchor="middle" dominant-baseline="middle" class="title">src/aad</text>

<!-- DATA -->
<rect x="240" y="300" width="260" height="180" class="inner" stroke="#A855F7"/>
<text x="370" y="325" text-anchor="middle" dominant-baseline="middle" class="title">Data</text>

<text x="260" y="355" class="file">data.py</text>
<text x="260" y="372" class="desc">dataset + augmentation</text>

<text x="260" y="400" class="file">audio_loader.py</text>
<text x="260" y="417" class="desc">ffmpeg audio loading</text>

<text x="260" y="445" class="file">collate.py</text>
<text x="260" y="462" class="desc">variable-length batching</text>

<!-- MODELS -->
<rect x="520" y="300" width="260" height="180" class="inner" stroke="#06B6D4"/>
<text x="650" y="325" text-anchor="middle" dominant-baseline="middle" class="title">Models</text>

<text x="540" y="355" class="file">model.py</text>
<text x="540" y="372" class="desc">CNN audio detector</text>

<text x="540" y="400" class="file">model_whisper.py</text>
<text x="540" y="417" class="desc">Whisper encoder model</text>

<!-- TRAINING -->
<rect x="800" y="300" width="260" height="180" class="inner" stroke="#F59E0B"/>
<text x="930" y="325" text-anchor="middle" dominant-baseline="middle" class="title">Training</text>

<text x="820" y="355" class="file">train.py</text>
<text x="820" y="372" class="desc">train / val loop</text>

<text x="820" y="400" class="file">config.py</text>
<text x="820" y="417" class="desc">hyperparams + device</text>

<!-- INFERENCE -->
<rect x="380" y="510" width="260" height="140" class="inner" stroke="#10B981"/>
<text x="510" y="535" text-anchor="middle" dominant-baseline="middle" class="title">Inference</text>

<text x="400" y="565" class="file">infer.py</text>
<text x="400" y="582" class="desc">prediction pipeline</text>

<!-- SERVING -->
<rect x="700" y="510" width="260" height="140" class="inner" stroke="#EC4899"/>
<text x="830" y="535" text-anchor="middle" dominant-baseline="middle" class="title">Serving</text>

<text x="720" y="565" class="file">api.py</text>
<text x="720" y="582" class="desc">REST prediction API</text>

<!-- DATA -->
<rect x="150" y="720" width="240" height="100" class="box" stroke="#A855F7"/>
<text x="270" y="745" text-anchor="middle" dominant-baseline="middle" class="title">data/</text>
<text x="270" y="770" text-anchor="middle" dominant-baseline="middle" class="desc">
train · val · test splits
</text>
  

<!-- CHECKPOINTS -->
<rect x="520" y="720" width="240" height="100" class="box" stroke="#F59E0B"/>
<text x="640" y="745" text-anchor="middle" dominant-baseline="middle" class="title">checkpoints/</text>
<text x="640" y="770" text-anchor="middle" dominant-baseline="middle" class="desc">
best_model.pt · saved weights
</text>

<!-- METRICS -->
<rect x="890" y="720" width="240" height="100" class="box" stroke="#EC4899"/>
<text x="1010" y="745" text-anchor="middle" dominant-baseline="middle" class="title">metrics/</text>
<text x="1010" y="770" text-anchor="middle" dominant-baseline="middle" class="desc">
confusion matrix · ROC curve
</text>

<!-- FLOW -->
<line x1="300" y1="180" x2="675" y2="220" class="line"/>
<line x1="1050" y1="180" x2="675" y2="220" class="line"/>

<line x1="675" y1="690" x2="270" y2="720" class="line"/>
